<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <!-- 绿色渐变 -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff88;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00cc6a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00ff88;stop-opacity:1" />
    </linearGradient>

    <!-- 发光效果 -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 阴影 -->
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00ff88" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- 莫比乌斯环 - 主体 -->
  <g transform="translate(200,180)" filter="url(#glow)">
    <!-- 莫比乌斯环路径 - 8字形扭转 -->
    <path d="
      M-80,0
      C-80,-45 -45,-75 0,-75
      C45,-75 80,-45 80,0
      C80,45 45,75 0,75
      C-45,75 -80,45 -80,0
      Z
    " fill="none" stroke="url(#greenGrad)" stroke-width="8" opacity="0.3"/>

    <!-- 莫比乌斯环 - 扭转效果 -->
    <path d="
      M-70,0
      C-70,-38 -38,-65 0,-65
      C38,-65 70,-38 70,0
      C70,38 38,65 0,65
      C-38,65 -70,38 -70,0
    " fill="none" stroke="url(#greenGrad)" stroke-width="6" stroke-linecap="round"/>

    <!-- 内部扭转线条 -->
    <path d="
      M-55,0
      C-55,-30 -30,-50 0,-50
      C30,-50 55,-30 55,0
      C55,30 30,50 0,50
      C-30,50 -55,30 -55,0
    " fill="none" stroke="url(#greenGrad)" stroke-width="4" opacity="0.7"/>

    <!-- 莫比乌斯环扭转交叉效果 -->
    <path d="M-20,-60 Q0,-80 20,-60" fill="none" stroke="url(#greenGrad)" stroke-width="5" stroke-linecap="round"/>
    <path d="M-20,60 Q0,80 20,60" fill="none" stroke="url(#greenGrad)" stroke-width="5" stroke-linecap="round"/>

    <!-- 中心无限符号 -->
    <path d="
      M-25,-5
      C-25,-20 -5,-20 0,-5
      C5,-20 25,-20 25,-5
      C25,10 5,10 0,-5
      C-5,10 -25,10 -25,-5
    " fill="url(#greenGrad)" opacity="0.9"/>
  </g>

  <!-- 装饰点 -->
  <circle cx="120" cy="180" r="3" fill="#00ff88" opacity="0.6"/>
  <circle cx="280" cy="180" r="3" fill="#00ff88" opacity="0.6"/>
  <circle cx="200" cy="100" r="3" fill="#00ff88" opacity="0.6"/>
  <circle cx="200" cy="260" r="3" fill="#00ff88" opacity="0.6"/>

  <!-- 公司名称 -->
  <text x="200" y="320" text-anchor="middle" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="42" font-weight="700" fill="white" letter-spacing="8">
    绿洲科技
  </text>

  <!-- 英文名称 -->
  <text x="200" y="355" text-anchor="middle" font-family="'Inter', 'Helvetica', sans-serif" font-size="16" fill="rgba(255,255,255,0.6)" letter-spacing="6">
    OASIS TECH
  </text>

  <!-- 底部装饰线 -->
  <line x1="140" y1="370" x2="260" y2="370" stroke="url(#greenGrad)" stroke-width="2" opacity="0.5"/>
</svg>